projects:
  - in: [short, long]
    name: "Kouji UI — Angular Design System & Component Library"
    role: { en: "Solo Author & Maintainer", fr: "Auteur Unique & Mainteneur" }
    type: { en: "Personal Open-Source Library", fr: "Bibliothèque Personnelle Open Source" }
    repo: "https://github.com/kouji-dev/kouji-ui"
    context:
      en: "An open-source **Angular 21** design system providing **60+ accessible, themable UI primitives** covering inputs, overlays, navigation, data display, feedback and layout. Maintained as a single-author library to demonstrate end-to-end *frontend platform engineering* — monorepo discipline, publishable package boundaries, accessibility-by-default and rigorous release management."
      fr: "Design system **Angular 21** open source fournissant **plus de 60 primitives UI accessibles et thémables** couvrant inputs, overlays, navigation, affichage de données, feedback et layout. Maintenu en solo pour démontrer une maîtrise complète du *frontend platform engineering* — discipline monorepo, frontières de packages publiables, accessibilité par défaut et gestion de releases rigoureuse."
    responsibilities:
      - in: [long]
        text:
          en: "Architected a **pnpm + Turborepo monorepo** with three publishable NPM packages — `components`, `core`, `themes` — plus a dedicated documentation app, sharing tooling, lint rules and a Tailwind v4 foundation"
          fr: "Architecturé un **monorepo pnpm + Turborepo** avec trois packages NPM publiables — `components`, `core`, `themes` — ainsi qu'un site de documentation dédié, partageant outillage, règles de lint et fondation Tailwind v4"
      - in: [long]
        text:
          en: "Authored **60+ standalone Angular 21 components** (calendar, combobox, command palette, date/time pickers, dialog, drawer, file upload, form, OTP input, popover, stepper, toast, tooltip, tree-select, …) designed for tree-shakability and signal-based change detection"
          fr: "Écrit **plus de 60 composants Angular 21 standalone** (calendar, combobox, command palette, date/time pickers, dialog, drawer, file upload, form, OTP input, popover, stepper, toast, tooltip, tree-select, …) conçus pour le tree-shaking et la détection de changement par signals"
      - in: [long]
        text:
          en: "Built a **decoupled theming layer** (`@kouji-ui/themes`) driven by **design tokens**, enabling theme switching, dark mode and per-product (multi-brand) overrides without forking components"
          fr: "Construit une **couche de thématisation découplée** (`@kouji-ui/themes`) pilotée par **design tokens**, permettant le changement de thème, le mode sombre et les overrides par produit (multi-marques) sans forker les composants"
      - in: [long]
        text:
          en: "Set up a **strict quality pipeline**: **Vitest** unit tests, **Playwright** end-to-end suites, automated **WCAG accessibility audits** (axe-based) producing JSON + HTML reports, plus ESLint, Prettier and Husky pre-commit hooks"
          fr: "Mis en place une **pipeline qualité stricte** : tests unitaires **Vitest**, suites end-to-end **Playwright**, **audits d'accessibilité WCAG** automatisés (basés axe) produisant des rapports JSON + HTML, plus ESLint, Prettier et hooks Husky pré-commit"
      - in: [long]
        text:
          en: "Established **release engineering** with **Changesets** for semantic versioning and changelog generation across the three packages, wired into **GitHub Actions** workflows"
          fr: "Établi le **release engineering** via **Changesets** pour le versioning sémantique et la génération de changelogs sur les trois packages, intégré aux workflows **GitHub Actions**"
      - in: [long]
        text:
          en: "Wrote contributor documentation and **AI-collaboration guidelines** (`CLAUDE.md`, `RULES.md`) so the library can be extended consistently by both humans and AI coding agents"
          fr: "Rédigé la documentation contributeur et des **directives de collaboration IA** (`CLAUDE.md`, `RULES.md`) pour que la bibliothèque puisse être étendue de manière cohérente par humains et agents IA"
    tech: "Angular 21, TypeScript, SCSS, Tailwind CSS, design tokens, pnpm workspaces, Turborepo, NPM, Changesets, Vitest, Playwright, axe-core, ESLint, Prettier, Husky, GitHub Actions"

