      fr: "Ingénieur Frontend Senior avec **plus de 7 ans d'expérience**, spécialisé en **Angular, TypeScript et CSS/SCSS** — conception, développement et distribution de **bibliothèques de composants et design systems à grande échelle** utilisés par plusieurs équipes et produits."
