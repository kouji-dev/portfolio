  - in: [long]
    text:
      en: "Used to working closely with **designers and product owners** (Figma, workshops, documentation), with a strong focus on accessibility, clean architecture, maintainability and developer experience."
      fr: "Habitué à collaborer étroitement avec les **designers et product owners** (Figma, ateliers, documentation), avec un fort accent sur l'accessibilité, l'architecture propre, la maintenabilité et l'expérience développeur."

