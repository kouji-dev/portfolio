experiences:
  - in: [short, long]
    company: "Preesm Group"
    role:
      en: "Full Stack Developer (Angular / Node.js)"
      fr: "Développeur Full Stack (Angular / Node.js)"
    dates: { en: "Since May 2026 (ongoing)", fr: "Depuis mai 2026 (en cours)" }
    client: null
    context:
      en: "**Preesm Portal** (preesm-group.com) — a B2B SaaS platform digitising the complete franchisee lifecycle of a French franchise network, used daily by headquarters staff, franchisors and franchisees. Sole engineer on the product, working directly with the client from requirements through to production operations."
      fr: "**Preesm Portal** (preesm-group.com) — plateforme SaaS B2B digitalisant le cycle de vie complet des franchisés d'un réseau de franchise français, utilisée au quotidien par le siège, les franchiseurs et les franchisés. Seul ingénieur sur le produit, en direct avec le client, du recueil du besoin à l'exploitation en production."
    responsibilities:
      - in: [short]
        text:
          en: "Designed and shipped **Preesm Portal** (B2B SaaS for a franchise network) **end to end as sole engineer** — **Angular 22** SPA, **Hono/Node.js** API, PostgreSQL — **first release in production within a month**"
          fr: "Conçu et livré **Preesm Portal** (SaaS B2B) **de bout en bout en tant que seul ingénieur** — SPA **Angular 22**, API **Hono/Node.js**, PostgreSQL — **première release en production en un mois**"
      - in: [short]
        text:
          en: "Built the **onboarding engine** driving the franchisee journey — a **declarative step catalog** with dependency-based unlocking, server-enforced status transitions, **document generation & signature**, a **file hub** and configurable e-mail notifications"
          fr: "Construit le **moteur d'onboarding** qui pilote le parcours franchisé — **catalogue d'étapes déclaratif** avec déblocage par dépendances, transitions de statut contrôlées côté serveur, **génération et signature de documents**, **hub documentaire** et notifications e-mail configurables"
      - in: [short]
        text:
          en: "Secured the platform with **passkey/MFA authentication** and **team-based, deny-by-default RBAC**, and ship through **GitHub Actions CI/CD** — **Render.com** staging, **OVH** production — with **Playwright E2E tests** gating every release"
          fr: "Sécurisé la plateforme avec l'authentification **passkey/MFA** et un **RBAC par équipes, deny-by-default**, et livré via une **CI/CD GitHub Actions** — staging **Render.com**, production **OVH** — avec des **tests E2E Playwright** validant chaque release"
      - in: [long]
        text:
          en: "Designed the architecture: **Angular 22** SPA (zoneless, signals) and a **Hono/Node.js** API in a pnpm monorepo, sharing one typed contract package (**Drizzle** schema + **Zod** DTOs)"
          fr: "Conçu l'architecture : SPA **Angular 22** (zoneless, signals) et API **Hono/Node.js** dans un monorepo pnpm, partageant un package de contrat typé (schéma **Drizzle** + DTOs **Zod**)"
      - in: [long]
        text:
          en: "Built the **onboarding engine** — declarative step catalog, dependency-based unlocking and a server-enforced status state machine with automatic progress tracking"
          fr: "Construit le **moteur d'onboarding** — catalogue d'étapes déclaratif, déblocage par dépendances et machine à états de statut contrôlée côté serveur avec suivi d'avancement automatique"
      - in: [long]
        text:
          en: "Developed the **franchisee portfolio back-office** (search, filters, archiving, network scoping) and the franchisee-facing space built on the same engine"
          fr: "Développé le **back-office portefeuille franchisés** (recherche, filtres, archivage, cadrage par réseau) et l'espace franchisé bâti sur le même moteur"
      - in: [long]
        text:
          en: "Implemented **server-side document generation** with **pdf-lib**, signed-counterpart storage, and a **file hub** on S3-compatible object storage with presigned upload/download"
          fr: "Implémenté la **génération de documents côté serveur** avec **pdf-lib**, le stockage des contreparties signées, et un **hub documentaire** sur stockage objet compatible S3 avec upload/download présignés"
      - in: [long]
        text:
          en: "Delivered **transactional mailing** over SMTP and an admin panel where staff configure notification recipients per business trigger, without a code change"
          fr: "Livré le **mailing transactionnel** en SMTP et un panneau d'administration où les équipes configurent les destinataires des notifications par déclencheur métier, sans modification de code"
      - in: [long]
        text:
          en: "Secured the platform with **BetterAuth** — WebAuthn passkeys, mandatory **TOTP MFA** — and a **deny-by-default RBAC** derived from a two-level team model, plus rate limiting and hashed invitation tokens"
          fr: "Sécurisé la plateforme avec **BetterAuth** — passkeys WebAuthn, **MFA TOTP obligatoire** — et un **RBAC deny-by-default** dérivé d'un modèle d'équipes à deux niveaux, avec rate limiting et tokens d'invitation hachés"
      - in: [long]
        text:
          en: "Set up **CI/CD on GitHub Actions** — lint, build, **Vitest** unit tests and a **Playwright E2E** suite run against a real PostgreSQL container — with Docker images published to GHCR"
          fr: "Mis en place la **CI/CD GitHub Actions** — lint, build, tests unitaires **Vitest** et suite **E2E Playwright** exécutée contre un conteneur PostgreSQL réel — avec images Docker publiées sur GHCR"
      - in: [long]
        text:
          en: "Operate production on an **OVH VPS** behind **Caddy** TLS: idempotent migrations, encrypted **pgBackRest** backups with restore drills and **SOPS/age**-managed secrets"
          fr: "Exploite la production sur un **VPS OVH** derrière TLS **Caddy** : migrations idempotentes, sauvegardes chiffrées **pgBackRest** avec exercices de restauration et secrets gérés via **SOPS/age**"
    achievements:
      - in: [long]
        text:
          en: "Shipped the **first production release within one month** and have delivered features continuously since, working directly with the client"
          fr: "Livré la **première release en production en moins d'un mois**, avec des fonctionnalités livrées en continu depuis, en direct avec le client"
      - in: [long]
        text:
          en: "Digitised the **full franchisee lifecycle**, replacing a manual document-and-e-mail process with a single traceable workflow"
          fr: "Digitalisé le **cycle de vie complet des franchisés**, en remplaçant un processus manuel à base de documents et d'e-mails par un workflow unique et traçable"
      - in: [long]
        text:
          en: "Eliminated API/frontend contract drift with the shared type package — a schema change now surfaces at compile time on both sides instead of in production"
          fr: "Éliminé la dérive de contrat API/frontend grâce au package de types partagé — un changement de schéma se voit désormais à la compilation des deux côtés plutôt qu'en production"
      - in: [long]
        text:
          en: "Turned the business process into **configuration rather than code**: new steps and notification recipients no longer require a release"
          fr: "Transformé le processus métier en **configuration plutôt qu'en code** : nouvelles étapes et destinataires de notifications ne nécessitent plus de release"
    tech: "Angular 22 (zoneless, signals), TypeScript, Tailwind CSS 4, Hono, Node.js, BetterAuth (passkeys, TOTP), PostgreSQL 17, Drizzle ORM, Zod, pdf-lib, nodemailer, S3-compatible storage, Playwright, Vitest, Docker, GitHub Actions, Render, OVH, Caddy, pgBackRest"

