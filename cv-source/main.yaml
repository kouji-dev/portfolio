  - in: [long]
    name: "GamerGG — Gaming Service Platform"
    role: { en: "Full Stack Developer", fr: "Développeur Full Stack" }
    type: { en: "Personal Side Project", fr: "Projet Personnel" }
    repo: "https://github.com/kouji-dev/GamerGG"
    context:
      en: "GamerGG is a **full-stack gaming service marketplace** designed to connect players with professional boosters and coaches. The platform enables gamers to purchase **rank boosting, coaching services, and gaming packages** while providing boosters with tools to manage orders, track performance, and engage with clients through integrated **Discord** communication."
      fr: "GamerGG est un **marché de services gaming full-stack** conçu pour connecter les joueurs avec des boosters et coachs professionnels. La plateforme permet aux joueurs d'acheter des **services de boost de rang, coaching et packages gaming** tout en fournissant aux boosters des outils pour gérer les commandes, suivre les performances et interagir avec les clients via une communication **Discord** intégrée."
    responsibilities:
      - in: [long]
        text:
          en: "Architected a **Turborepo monorepo** structure enabling shared components and utilities across multiple Next.js applications with optimized build caching"
          fr: "Architecturé une structure **monorepo Turborepo** permettant des composants et utilitaires partagés à travers plusieurs applications Next.js avec un cache de build optimisé"
      - in: [long]
        text:
          en: "Built a **modern, responsive web application** with **Next.js 13**, **TypeScript**, and **Tailwind CSS**, implementing server-side rendering and API routes"
          fr: "Construit une **application web moderne et responsive** avec **Next.js 13**, **TypeScript** et **Tailwind CSS**, implémentant le rendu côté serveur et les routes API"
      - in: [long]
        text:
          en: "Designed and implemented **authentication and authorization** using **NextAuth.js** with OAuth providers and secure session management"
          fr: "Conçu et implémenté l'**authentification et autorisation** utilisant **NextAuth.js** avec des providers OAuth et une gestion de session sécurisée"
      - in: [long]
        text:
          en: "Developed a **robust database layer** using **Prisma ORM** with **PostgreSQL**, implementing migrations, seeding, and type-safe queries"
          fr: "Développé une **couche de base de données robuste** utilisant **Prisma ORM** avec **PostgreSQL**, implémentant les migrations, seeding et requêtes type-safe"
      - in: [long]
        text:
          en: "Created a **comprehensive order management system** with real-time status tracking, active boost monitoring, and order history for both clients and boosters"
          fr: "Créé un **système de gestion de commandes complet** avec suivi de statut en temps réel, monitoring de boost actif et historique de commandes pour les clients et boosters"
      - in: [long]
        text:
          en: "Integrated **Discord server** connectivity for seamless communication between clients and boosters within the platform"
          fr: "Intégré la **connectivité serveur Discord** pour une communication fluide entre clients et boosters au sein de la plateforme"
      - in: [long]
        text:
          en: "Implemented a **user analytics dashboard** featuring top boosters leaderboard, user spending tracking, and performance metrics"
          fr: "Implémenté un **tableau de bord d'analytics utilisateur** présentant un classement des meilleurs boosters, suivi des dépenses utilisateur et métriques de performance"
      - in: [long]
        text:
          en: "Established a **reusable UI component library** shared across the monorepo with a consistent design system and TypeScript types"
          fr: "Établi une **bibliothèque de composants UI réutilisables** partagée à travers le monorepo avec un système de design cohérent et des types TypeScript"
    tech: "Next.js 13, React 18, TypeScript, Prisma, PostgreSQL, NextAuth.js, Tailwind CSS, Turborepo, Yarn Workspaces, OAuth, Discord API, Git, GitHub Actions"

  - in: [long]
    name: "Acta — Accounting Firm Project Management Platform"
    role: { en: "Full Stack Developer", fr: "Développeur Full Stack" }
    type: { en: "Personal Side Project", fr: "Projet Personnel" }
    context:
      en: "Acta is a **comprehensive project management platform** designed specifically for accounting firms to streamline **cross-functional production tracking** across multiple teams. The platform enables real-time task planning, time tracking, and ticketing for complex accounting workflows, managing hierarchical structures of **portfolios, files, missions, and tasks** with progressive validation workflows and multi-dimensional progress visualization."
      fr: "Acta est une **plateforme complète de gestion de projets** conçue spécifiquement pour les cabinets comptables afin de rationaliser le **suivi de production inter-fonctionnel** à travers plusieurs équipes. La plateforme permet la planification de tâches en temps réel, le suivi du temps et le ticketing pour des flux de travail comptables complexes, gérant des structures hiérarchiques de **portefeuilles, dossiers, missions et tâches** avec des workflows de validation progressive et une visualisation multi-dimensionnelle de la progression."
    responsibilities:
      - in: [long]
        text:
          en: "Architected a **full-stack monorepo** with **Angular 21** frontend and **Express.js** backend, implementing **role-based access control (RBAC)** with granular permissions"
          fr: "Architecturé un **monorepo full-stack** avec frontend **Angular 21** et backend **Express.js**, implémentant un **contrôle d'accès basé sur les rôles (RBAC)** avec des permissions granulaires"
      - in: [long]
        text:
          en: "Designed a **complex hierarchical data model** using **Prisma ORM** with **PostgreSQL**, supporting portfolios → files → missions → tasks relationships with progressive validation workflows"
          fr: "Conçu un **modèle de données hiérarchique complexe** utilisant **Prisma ORM** avec **PostgreSQL**, supportant les relations portefeuilles → dossiers → missions → tâches avec workflows de validation progressive"
      - in: [long]
        text:
          en: "Built **multi-dimensional visualization features** including calendar views, progress tracking by collaborator or file, and time tracking dashboards with daily/weekly/monthly/yearly aggregations"
          fr: "Construit des **fonctionnalités de visualisation multi-dimensionnelles** incluant des vues calendrier, suivi de progression par collaborateur ou dossier, et tableaux de bord de suivi du temps avec agrégations quotidiennes/hebdomadaires/mensuelles/annuelles"
      - in: [long]
        text:
          en: "Developed **real-time task management** with status workflows, a due-date change-request system with approval workflows, and automatic task assignment based on role-based folder assignments"
          fr: "Développé une **gestion de tâches en temps réel** avec workflows de statut, système de demandes de modification de dates d'échéance avec workflows d'approbation, et attribution automatique de tâches basée sur les affectations de dossiers par rôle"
      - in: [long]
        text:
          en: "Implemented a **comprehensive time tracking system** with detailed reporting, enabling analysis by collaborator, file, task, or mission with flexible filtering and aggregation"
          fr: "Implémenté un **système complet de suivi du temps** avec capacités de reporting détaillées, permettant l'analyse par collaborateur, dossier, tâche ou mission avec filtrage et agrégation flexibles"
      - in: [long]
        text:
          en: "Created **responsive, data-rich UI components** using **TanStack Table** for complex data grids, **Luxon** for date/time handling, and **Tailwind CSS** for modern, accessible design"
          fr: "Créé des **composants UI réactifs et riches en données** utilisant **TanStack Table** pour des grilles de données complexes, **Luxon** pour la gestion des dates/heures, et **Tailwind CSS** pour un design moderne et accessible"
      - in: [long]
        text:
          en: "Established **robust authentication and authorization** using **JWT** and **Passport.js** with role-based route guards and permission-based feature access"
          fr: "Établi une **authentification et autorisation robustes** utilisant **JWT** et **Passport.js** avec gardes de route basés sur les rôles et accès aux fonctionnalités basé sur les permissions"
    tech: "Angular 21, TypeScript, Express.js, Prisma, PostgreSQL, JWT, Passport.js, TanStack Table, Luxon, Tailwind CSS, Docker, pnpm"

  - in: [long]
    name: "Chartify — Figma Plugin"
    role: { en: "Plugin Developer", fr: "Développeur de Plugin" }
    type: { en: "Figma Community Plugin", fr: "Plugin Communautaire Figma" }
    link: "https://www.figma.com/community/plugin/1361309122482309141/chartify"
    context:
      en: "Chartify is a **Figma community plugin** designed to streamline the creation of data visualizations and charts directly within Figma's design environment. The plugin enables designers to quickly generate various chart types, customize data visualizations, and integrate charts seamlessly into their design workflows without leaving Figma."
      fr: "Chartify est un **plugin communautaire Figma** conçu pour rationaliser la création de visualisations de données et graphiques directement dans l'environnement de design Figma. Le plugin permet aux designers de générer rapidement différents types de graphiques, personnaliser les visualisations de données et intégrer des graphiques de manière fluide dans leurs workflows de design sans quitter Figma."
    responsibilities:
      - in: [long]
        text:
          en: "Developed a **Figma plugin** using TypeScript and the Figma Plugin API to extend design-tool capabilities"
          fr: "Développé un **plugin Figma** utilisant TypeScript et l'API Plugin Figma pour étendre les capacités de l'outil de design"
      - in: [long]
        text:
          en: "Implemented **chart generation functionality** supporting multiple chart types and customizable data visualization options"
          fr: "Implémenté une **fonctionnalité de génération de graphiques** supportant plusieurs types de graphiques et options de visualisation de données personnalisables"
      - in: [long]
        text:
          en: "Created an **intuitive user interface** within Figma's plugin environment for easy chart configuration and customization"
          fr: "Créé une **interface utilisateur intuitive** dans l'environnement plugin de Figma pour une configuration et personnalisation faciles des graphiques"
      - in: [long]
        text:
          en: "Ensured **seamless integration** with Figma's design system, allowing charts to be easily incorporated into design files"
          fr: "Assuré une **intégration fluide** avec le système de design de Figma, permettant aux graphiques d'être facilement incorporés dans les fichiers de design"
      - in: [long]
        text:
          en: "Published and maintained the plugin in the **Figma Community**, making it accessible to designers worldwide"
          fr: "Publié et maintenu le plugin dans la **Communauté Figma**, le rendant accessible aux designers du monde entier"
    tech: "Angular, TypeScript, Taiga UI, Figma Plugin API, Figma Community"

