          fr: "Livré un **frontend hautement performant et réactif** avec **Angular 21** et **Angular Signals** avec des composants réutilisables et responsives"
      - in: [long]
        text:
          en: "Engineered a **production-ready REST API** with **FastAPI (Python 3.12)**, integrated with **PostgreSQL** via **SQLAlchemy 2.0** and **Redis**"
          fr: "Ingéniéré une **API REST prête pour la production** avec **FastAPI (Python 3.12)**, intégrée avec **PostgreSQL** via **SQLAlchemy 2.0** et **Redis**"
      - in: [long]
        text:
          en: "Implemented **end-to-end project management workflows** including sprint planning, issue tracking, Kanban boards, and backlog management with **real-time collaboration** via WebSockets"
          fr: "Implémenté des **workflows de gestion de projet de bout en bout** incluant la planification de sprints, le suivi de tickets, les tableaux Kanban et la gestion de backlog avec **collaboration en temps réel** via WebSockets"
      - in: [long]
        text:
          en: "Enabled **rich documentation authoring** through **Lexical editor** integration and ensured code quality with comprehensive test coverage (unit, integration, functional) and automated CI/CD workflows"
          fr: "Activé la **rédaction de documentation riche** grâce à l'intégration de l'**éditeur Lexical** et assuré la qualité du code avec une couverture de tests complète (unitaire, intégration, fonctionnel) et des workflows CI/CD automatisés"
