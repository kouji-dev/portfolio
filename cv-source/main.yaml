      - in: [long]
        text:
          en: "Built an **OpenAI/Anthropic-compatible gateway** with a **provider registry**, routing all usage through a single governed endpoint with drop-in model substitution"
          fr: "Construit une **passerelle compatible OpenAI/Anthropic** avec un **registre de providers**, routant tout l'usage à travers un endpoint unique et gouverné avec substitution de modèles transparente"
      - in: [long]
        text:
          en: "Implemented **enterprise governance** — **per-member budgets**, **RBAC**, audit logging and **cost attribution** per acting user / app — enforced across tenants"
          fr: "Implémenté une **gouvernance d'entreprise** — **budgets par membre**, **RBAC**, journalisation d'audit et **attribution des coûts** par utilisateur / application — appliquée à travers les tenants"
      - in: [long]
        text:
          en: "Designed a **multi-tenant data layer** on **PostgreSQL + Drizzle** with **row-level security (RLS)** for tenant isolation, and **Redis** for caching and real-time usage counters"
          fr: "Conçu une **couche de données multi-tenant** sur **PostgreSQL + Drizzle** avec **row-level security (RLS)** pour l'isolation des tenants, et **Redis** pour le cache et les compteurs d'usage temps réel"
      - in: [long]
        text:
          en: "Integrated **Stripe billing** (SaaS mode) and **Zod-validated DTOs** shared across apps, and shipped a **Vortex CLI** plus a thin **SDK** with acting-user / acting-app helpers"
          fr: "Intégré la **facturation Stripe** (mode SaaS) et des **DTOs validés par Zod** partagés entre les apps, et livré un **CLI Vortex** ainsi qu'un **SDK** léger avec helpers acting-user / acting-app"
