      - in: [long]
        text:
          en: "Architected a **pnpm monorepo** (feature-per-folder, hexagonal-lite) with a **Hono** API + gateway, two **Angular 22 (zoneless)** consoles — tenant and platform super-admin — and shared `core`, `db`, `shared`, `sdk` and `cli` packages"
